# knowledge/rules/schema.yaml — Canonical metadata schema for the clinical knowledge base.
#
# This is the single source of truth for every field that flows from a curated
# source file into Chroma metadata. The retrieval layer (clinical/retrieval/)
# filters on framework / chapter / topic / intervention / symptom / population,
# so those exact keys must be produced here and validated on ingest.
#
# version: bump when the schema changes (invalidates/re-builds index).

version: "1.0.0"

# ── Frameworks (must match FrameworkRegistry slugs) ──────────────────────
frameworks:
  - humanistic
  - alliance_rupture
  - act
  - dbt
  - mi
  - cbt
  - general

# ── Static content metadata (curated; written into the source front-matter) ──
static_fields:
  framework:
    type: enum
    values: [humanistic, alliance_rupture, act, dbt, mi, cbt, general]
    required: true
  book_slug:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    required: true
    description: Stable book identifier used in chunk_id and manifest filenames.
  book_title:
    type: string
    required: true
  authors:
    type: list[string]
    required: true
  edition:
    type: int
    required: true
  publication_year:
    type: int
    required: true
  publisher:
    type: string
    required: false
  isbn:
    type: string
    required: false
  language:
    type: enum
    values: [en]
    required: true
  chapter:
    type: int
    required: true
  chapter_title:
    type: string
    required: true
  section:
    type: string
    required: false
    description: Section within the chapter; becomes the parent-unit boundary.
  topic:
    type: list[controlled]
    vocab: topics
    required: false
  intervention:
    type: list[controlled]
    vocab: interventions
    required: false
  symptom:
    type: list[controlled]
    vocab: symptoms
    required: false
  population:
    type: list[controlled]
    vocab: populations
    required: false
  content_type:
    type: enum
    values: [prose, table, boxed-exercise, case-vignette, checklist, front-matter]
    required: true
  citation_ids:
    type: list[string]
    pattern: "^bib:[a-z0-9]+$"
    required: true
    description: Must resolve in knowledge/citations/bibliography.bib or build fails.

# ── Derived/index metadata (generated by the ingest pipeline) ────────────
derived_fields:
  chunk_id:
    type: string
    pattern: "^[a-z0-9-]+:[0-9]+:[a-z0-9-]+:[0-9]+$"
    description: '{book_slug}:{chapter}:{section}:{seq} — deterministic.'
  parent_id:
    type: string
    description: ID of the parent unit this chunk belongs to.
  content_hash:
    type: string
    description: sha256 of the chunk body; detects drift for incremental re-index.
  source_hash:
    type: string
    description: sha256 of the whole-book manifest; triggers full re-embed.
  embedding_model:
    type: string
    description: Pinned embedding model id (e.g. BAAI/bge-large-en-v1.5).
  index_version:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}$"
    description: e.g. 2026-08. Bump forces re-embed of the whole book.
  created_at:
    type: datetime
  updated_at:
    type: datetime
  index_status:
    type: enum
    values: [draft, validated, embedded, superseded]
  confidence:
    type: float
    range: [0, 1]
    description: Curation confidence (human-authored = 1.0; AI-assisted < 1.0).

# ── Controlled vocabularies ──────────────────────────────────────────────
# Lint-enforced. Retrievers can then rely on exact matches for $eq/$in filters.
vocabularies:
  topics:
    common: [self-concept, incongruence, self-regard, meaning-making, identity,
             relationship, growth, self-actualisation, belonging, shame, guilt,
             values, psychological-flexibility, experiential-avoidance,
             cognitive-fusion, present-moment-awareness, self-as-context,
             committed-action, automatic-thoughts, core-beliefs, intermediate-beliefs,
             cognitive-distortions, cognitive-triad, behavioural-activation,
             emotional-regulation, mindfulness, interpersonal-effectiveness,
             distress-tolerance, readiness-for-change, ambivalence, alliance,
             rupture, repair, common-factors]
  interventions:
    common: [empathic-responding, unconditional-positive-regard, therapist-congruence,
             focusing, gestalt-two-chair, empty-chair, phenomenological-inquiry,
             defusion, acceptance, values-clarification, committed-action-planning,
             mindfulness-exercise, creative-hopelessness, thought-record,
             cognitive-restructuring, socratic-questioning, behavioural-experiment,
             exposure, response-prevention, activity-scheduling, psychoeducation,
             chain-analysis, opposite-action, distress-tolerance-skills,
             open-ended-questioning, reflective-listening, decisional-balance,
             agenda-setting, rupture-repair-intervention, relational-process-comment]
  symptoms:
    common: [low-mood, anhedonia, worry, rumination, panic, avoidance,
             compulsive-behaviour, intrusive-thoughts, hyperarousal, insomnia,
             low-self-worth, chronic-pain, burnout, substance-use, binge-eating,
             irritability, dissociation, self-harm-urge, suicidality, isolation]
  populations:
    common: [adults, adolescents, children, older-adults, veterans,
             chronic-pain, carers, perinatal, marginalised-groups, adolescents]

# ── Chunking budget (mirrors knowledge/rules/chunking-rules.yaml) ────────
chunking:
  child_min_tokens: 200
  child_max_tokens: 400
  child_overlap_tokens: 50
  parent_min_tokens: 1500
  parent_max_tokens: 3000
  never_split_content_types: [table, boxed-exercise, case-vignette]

# ── Collection naming (mirrors knowledge/rules/collection-plan.yaml) ─────
collections:
  pattern: "kb_{framework}_{index_version}"
  example: "kb_act_2026-08"
  alias_file: "knowledge/index/manifest.lock"
