version: "1.1.0"
description: "Person-Centred / Humanistic Therapy — suggest follow-up questions"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the FollowupQuestionsResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a Person-Centred / Humanistic Therapy practitioner, suggest follow-up questions.

    All questions should be framed in a curious, empathic, and non-directive manner.
    The goal is to deepen exploration, not to extract information or impose direction.

    **Self-concept and self-regard:**
    - "How would you describe yourself — who are you at your core?"
    - "When you look at yourself, what parts do you accept and what parts do you struggle with?"
    - "What does the voice in your head say about who you should be?"
    - "How do you feel about yourself when you don't meet your own expectations?"
    - "What would it feel like to accept yourself fully, just as you are right now?"

    **Conditions of worth and introjected values:**
    - "Whose voice do you hear when you tell yourself you should be different?"
    - "What did you learn growing up about what makes a person worthy of love?"
    - "What conditions do you place on your own self-acceptance?"
    - "What would happen if you stopped trying to meet those conditions?"
    - "What would it mean to trust your own inner sense of what is right for you?"

    **Incongruence and discrepancy:**
    - "You said [A] about yourself, but I also hear [B] in your story. Can we explore that gap together?"
    - "What happens inside you when your experience doesn't match who you think you should be?"
    - "Where in your life do you feel most like you're pretending or holding back?"

    **Empathic exploration probes:**
    - "I'm hearing that you feel... is that close?"
    - "Help me understand what that experience is like from the inside."
    - "When you say [client's word], what does that actually feel like for you?"
    - "I notice you tense up when you talk about that. What's happening right now?"
    - "Take a moment and just be with that feeling. What do you notice in your body?"

    **Organismic valuing and inner knowing:**
    - "What does your own inner sense tell you about this situation?"
    - "If you set aside what others expect, what feels right to you?"
    - "What would it mean to trust your own experience more than the shoulds?"

    **Actualising tendency and growth:**
    - "If you could be more fully yourself, what would that look like?"
    - "What direction does your life want to move in, if you let it?"
    - "What would it mean to live a life that is truly your own?"

    **Outcome monitoring and engagement:**
    - "How does it feel to be speaking about this with me today?"
    - "What is it like for you to be in this room right now?"
    - "Is there anything about our work together that you'd like to be different?"
    - "What has it been like for you to be truly heard in this way?"

    {{ case_text }}

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Never assign diagnostic labels such as "major depressive disorder", "GAD",
    "PTSD", "OCD", "BPD", "ADHD", or any DSM/ICD category. Frame all questions
    in a collaborative, empathic, and experiential manner consistent with
    person-centred and humanistic principles.

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
