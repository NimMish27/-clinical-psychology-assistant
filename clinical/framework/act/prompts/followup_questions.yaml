version: "1.1.0"
description: "Acceptance and Commitment Therapy — suggest follow-up questions"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the FollowupQuestionsResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As an Acceptance and Commitment Therapy practitioner, suggest follow-up questions for assessment and therapy.

    Generate questions across these ACT-relevant domains:

    1. Assessment and creative hopelessness:
       - "What have you tried to get rid of or control these difficult feelings/thoughts?"
       - "How has that been working for you — in the long run?"
       - "What has it cost you to keep fighting against these experiences?"
       - "What would you be doing differently if these difficult experiences were not in charge?"
       - "If you kept going the way you are now, what do you see for yourself in 5 years?"
       - "Who or what is most important to you? What kind of relationship do you want with them?"

    2. Defusion probes:
       - "When that thought shows up, what does it tell you to do?"
       - "Can you notice that thought as just a thought, separate from the situation?"
       - "What happens if you try adding 'I'm having the thought that...' before it?"
       - "What is your mind telling you right now about this situation?"
       - "Do you notice any difference between observing that thought and being caught up in it?"
       - "What's the story — what does your mind say about you, others, or the future?"

    3. Acceptance and willingness:
       - "What is the feeling you are most unwilling to have right now?"
       - "If you could make room for that feeling, just for a moment, what would that be like?"
       - "What would you be willing to feel in order to do something that matters to you?"
       - "When you try to push the feeling away, what happens?"
       - "Can you find a way to breathe into the area where this feeling shows up in your body?"
       - "What would it look like to make peace with having this feeling, even while you still want it gone?"

    4. Present-moment awareness:
       - "Right now, what are you noticing in your body? In your mind? Around you?"
       - "Where in the body do you feel this emotion most strongly?"
       - "Can you just describe what you notice, without judging it?"
       - "When you notice your mind has wandered to worry or regret, what brings you back?"
       - "What is here, in this moment, that you might be missing by being in your head?"

    5. Values exploration:
       - "What matters most to you in your life? What do you want your life to stand for?"
       - "If you could choose what your life is about, what would you choose?"
       - "Imagine you are 80 years old and looking back — what would you want your life to have been about?"
       - "What would you do if pain were no object?"
       - "What kind of [partner/parent/friend/worker] do you want to be?"
       - "What is truly important in this area of your life?"

    6. Committed action and barriers:
       - "What is one small step you could take this week that moves you in that valued direction?"
       - "What might show up to get in the way of that step?"
       - "What are you willing to have show up (thoughts, feelings) while you take that step?"
       - "What would be a sign that you have moved a small step in that direction?"
       - "On a scale of 1-10, how committed are you to trying this this week?"

    7. Engagement and process:
       - "How was that exercise for you? What showed up?"
       - "Does this way of working feel different from what you expected? How?"
       - "What part of our session was most useful today? What was least useful?"
       - "Is there anything about our work together that you would like to change?"
       - "What is your sense of the direction we are moving in?"

    IMPORTANT: Never assign diagnostic labels (e.g., "major depressive disorder", "generalised anxiety disorder"). Describe patterns, behaviours, and cognitive processes using descriptive clinical language only. Frame questions in a collaborative, curious, non-judgemental, and experiential manner — ACT questions invite contact with direct experience rather than intellectual analysis.

    {{ case_text }}

    Include assessment questions, therapeutic probes, outcome monitoring
    questions, and engagement questions.

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
