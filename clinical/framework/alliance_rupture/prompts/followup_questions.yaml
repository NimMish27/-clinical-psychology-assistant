version: "1.0.0"
description: "Alliance-Focused / Rupture Repair — suggest follow-up questions"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the FollowupQuestionsResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a Alliance-Focused / Rupture Repair practitioner, suggest follow-up questions.

    Alliance monitoring, rupture marker tracking, metacommunication practice, relational pattern identification

    {{ case_text }}

    Include assessment questions, therapeutic probes, outcome monitoring
    questions, and engagement questions.

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
