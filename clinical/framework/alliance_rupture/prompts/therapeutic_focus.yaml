version: "1.0.0"
description: "Alliance-Focused / Rupture Repair — identify therapeutic focus areas"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the TherapeuticFocusResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a Alliance-Focused / Rupture Repair practitioner, identify therapeutic focus areas.

    Metacommunication about the therapeutic relationship, repairing alliance strains, addressing interpersonal patterns

    {{ case_text }}

    Specify primary and secondary focus areas, staging/sequencing,
    and the clinical rationale.

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
