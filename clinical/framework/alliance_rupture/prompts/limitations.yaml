version: "1.0.0"
description: "Alliance-Focused / Rupture Repair — describe limitations and contraindications"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the LimitationsResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a Alliance-Focused / Rupture Repair expert, describe limitations.

    Requires therapist comfort with immediacy; may not be the primary intervention when alliance is strong

    {{ case_text }}

    List contraindications, precautions, alternative frameworks that
    may be more appropriate, and general caveats.

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
