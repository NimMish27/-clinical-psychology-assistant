version: "1.0.0"
description: "Motivational Interviewing — describe limitations and contraindications"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the LimitationsResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a Motivational Interviewing expert, describe limitations.

    Primarily a brief intervention; less suited for severe mental illness as a standalone treatment; requires fidelity to MI spirit

    {{ case_text }}

    List contraindications, precautions, alternative frameworks that
    may be more appropriate, and general caveats.

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
