version: "1.0.0"
description: "General Psychotherapy — retrieve and synthesise relevant evidence"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the EvidenceResult model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a General Psychotherapy practitioner, retrieve relevant evidence.

    Common factors research, practice guidelines, meta-analyses of psychotherapy outcomes

    {{ case_text }}

    Identify key findings, synthesise the evidence base, note gaps,
    and rate your confidence. If no literature collection is available,
    suggest the type of evidence that would be needed.

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
