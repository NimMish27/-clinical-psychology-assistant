version: "1.0.0"
description: "Dialectical Behavior Therapy — analyse a clinical case through the framework lens"
variables:
  - name: system_header
    description: "System prompt header identifying the framework"
    required: true
  - name: case_text
    description: "Formatted case understanding, formulation, and evidence"
    required: true
  - name: output_schema
    description: "JSON schema for the CaseAnalysis model"
    required: true
templates:
  en: |
    {{ system_header }}

    As a Dialectical Behavior Therapy practitioner, analyse this case.

    Assess emotion dysregulation patterns, invalidation history, behavioural dyscontrol, and skills deficits across four modules

    {{ case_text }}

    Respond with valid JSON matching this schema exactly:
    {{ output_schema }}

    Return ONLY the JSON object. No markdown fences.
    No explanatory text before or after.
